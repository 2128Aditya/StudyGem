<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      StudyGem - Online Study Platform, Mock Tests, PYQs & AI Study Assistant

    <meta
      name="description"
      content="StudyGem is an online study platform for students offering Mock Tests, Previous Year Questions (PYQs), Current Affairs, Study Roadmaps, AI Study Assistant and personalized learning tools."

      content="StudyGem, online study platform, study app, mock tests, PYQs, previous year questions, current affairs, study roadmap, AI study assistant, exam preparation, competitive exam preparation, government exam preparation"
    />

    <meta name="author" content="StudyGem" />

    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#6d28f0" />

    <!-- Canonical -->

      rel="canonical"
      href="https://study-gem-three.vercel.app/"
    />

    <!-- Favicon -->

      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="StudyGem - Your Knowledge, Your Growth"
    />

    <meta
      property="og:description"
      content="Study smarter with StudyGem. Explore Mock Tests, Previous Year Questions, Current Affairs, Study Roadmaps and AI-powered learning tools."

      property="og:url"
      content="https://study-gem-three.vercel.app/"
    />

      content="StudyGem"

      property="og:image"

      content="StudyGem - Your Knowledge, Your Growth"
    />

      name="twitter:description"

    />

    <meta
      name="twitter:image"
      content="https://study-gem-three.vercel.app/og-image.png"
    />

    <!-- PWA -->

      rel="manifest"
      href="/manifest.webmanifest"
    />
