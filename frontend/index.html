<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      StudyGem - Online Study Platform, Mock Tests, PYQs & AI Study Assistant
    </title>

    <meta
      name="description"
      content="StudyGem is an all-in-one study platform for students with Previous Year Questions, Mock Tests, Current Affairs, Study Roadmaps, Leaderboards and an AI Study Assistant."
    />

    <meta
      name="keywords"
      content="StudyGem, online study platform, study app, mock tests, PYQs, previous year questions, current affairs, study roadmap, AI study assistant, competitive exam preparation, government exam preparation"
    />

    <meta name="author" content="StudyGem" />

    <meta name="robots" content="index, follow" />

    <meta name="theme-color" content="#6d28f0" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://YOUR-DOMAIN.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <!-- Apple / Mobile -->
    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="StudyGem - Your Knowledge, Your Growth"
    />

    <meta
      property="og:description"
      content="Learn, practice and grow with StudyGem. Explore PYQs, Mock Tests, Current Affairs, Study Roadmaps and AI-powered learning."
    />

    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/og-image.png"
    />

    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />

    <meta
      property="og:site_name"
      content="StudyGem"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="StudyGem - Your Knowledge, Your Growth"
    />

    <meta
      name="twitter:description"
      content="Study smarter with PYQs, Mock Tests, Current Affairs, Roadmaps and AI-powered learning."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/og-image.png"
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
